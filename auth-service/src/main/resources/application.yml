server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: auth-service

  # C2: PostgreSQL user store
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:dms}
    password: ${DB_PASSWORD:dms123}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# JWT Configuration
jwt:
  # 256-bit secret key (base64 encoded) — keep secret, never hardcode in prod
  secret: ${JWT_SECRET:dms-super-secret-key-for-jwt-signing-must-be-256-bits-long!!}
  # Token expiry in milliseconds: 24 hours = 86400000
  expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
