spring.application.name=documents-service
server.port=${SERVER_PORT:8081}

# =============================================
# DATABASE CONFIGURATION
# Switches between H2 (dev) and PostgreSQL (prod)
# =============================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:documentsdb}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# =============================================
# S3 / MinIO CONFIGURATION
# =============================================
app.s3.region=${S3_REGION:us-east-1}
app.s3.access-key=${S3_ACCESS_KEY:admin}
app.s3.secret-key=${S3_SECRET_KEY:ensia123456}
app.s3.bucket=${S3_BUCKET:dms-documents}
app.s3.path-style-access=${S3_PATH_STYLE_ACCESS:true}
app.s3.presign-duration-seconds=${S3_PRESIGN_DURATION_SECONDS:300}

# Internal endpoint (server → MinIO, stays as-is)
app.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}

# Public endpoint (used in presigned URLs returned to the browser)
app.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:9000}

# =============================================
# ACTUATOR
# =============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Redis Cache
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=60000

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false