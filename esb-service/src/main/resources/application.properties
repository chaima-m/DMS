spring.application.name=esb-service
server.port=${SERVER_PORT:8084}

# URLs for downstream services (use container names in Docker)
services.documents.url=${DOCUMENTS_SERVICE_URL:http://localhost:8081}
services.comments.url=${COMMENTS_SERVICE_URL:http://localhost:8083}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
