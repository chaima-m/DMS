server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: false
      routes:
        - id: documents
          uri: ${DOCUMENTS_SERVICE_URL:http://documents:8081}
          predicates:
            - Path=/api/documents/**
          filters:
            - StripPrefix=1

        - id: comments
          uri: ${COMMENTS_SERVICE_URL:http://comments:8083}
          predicates:
            - Path=/api/comments/**
          filters:
            - StripPrefix=1

        - id: esb
          uri: ${ESB_SERVICE_URL:http://esb:8084}
          predicates:
            - Path=/api/document/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,mappings,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true